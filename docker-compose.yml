# Valorile secrete NU sunt în acest fișier. Se citesc din ./secrets/*.txt
# (create cu setup-secrets.ps1 / setup-secrets.sh, ignorate de Git) și sunt
# montate în containere ca fișiere în /run/secrets, nu ca variabile de mediu.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-eventhub}
      POSTGRES_DB: ${DB_NAME:-eventhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432" # accesibil doar de pe acest calculator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-eventhub}
      DB_NAME: ${DB_NAME:-eventhub}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Imaginea rulează cu NODE_ENV=production; local păstrăm documentația /api/docs.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Setează doar în spatele unui reverse proxy (ex. 1), ca limitarea cererilor să vadă IP-ul real.
      TRUST_PROXY: ${TRUST_PROXY:-}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ORGANIZER_INVITE_CODE_FILE: /run/secrets/organizer_invite_code
      # Emailuri (vezi README, „Email”). Fără cheie Resend, emailurile sunt doar scrise în log.
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      MAIL_FROM: ${MAIL_FROM:-EventHub <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-http://localhost:5173}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Bucharest}
      # Adresa publică a API-ului: linkurile „.ics” din emailuri trimit aici.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
      # Imaginile de copertă: local în volumul `uploads`; pe Cloudinary dacă secrets/cloudinary_url.txt nu e gol.
      UPLOADS_DIR: /app/uploads
      CLOUDINARY_URL_FILE: /run/secrets/cloudinary_url
      # Harta (vezi README, „Harta”): Nominatim / OpenStreetMap; GEOCODER=off oprește cererile.
      GEOCODER: ${GEOCODER:-nominatim}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
      # Opționale (vezi README, „Google, Turnstile, Sentry”): fiecare pornește doar cu cheile lui.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Cookie-ul de sesiune: imaginea rulează cu NODE_ENV=production, dar local pe http://localhost (fără HTTPS).
      # Într-o instalare reală, cu HTTPS, setează COOKIE_SECURE=true (sau elimină linia).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/app/uploads
    secrets:
      - db_password
      - jwt_secret
      - organizer_invite_code
      - resend_api_key
      - cloudinary_url
      - google_client_secret
      - turnstile_secret_key
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  organizer_invite_code:
    file: ./secrets/organizer_invite_code.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt # poate fi gol
  cloudinary_url:
    file: ./secrets/cloudinary_url.txt # poate fi gol (imaginile rămân pe disc)
  google_client_secret:
    file: ./secrets/google_client_secret.txt # poate fi gol (fără „Continuă cu Google”)
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key.txt # poate fi gol (fără verificare anti-robot)

volumes:
  pgdata:
  uploads: # imaginile de copertă (stocarea locală)
